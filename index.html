<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steele Leaf - 静态网页</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #000000;
            --bg-card: #0f0f0f;
            --bg-card-hover: #1a1a1a;
            --accent: #0066ff;
            --accent-light: #4d94ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: #333333;
            --border-hover: #0066ff;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: "Segoe UI", "Arial", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* --- 顶部导航区 --- */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
            position: relative;
            z-index: 10;
        }

        .header-top {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        /* Logo 图片 */
        .logo-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-img {
            max-height: 80px;
            width: auto;
            display: block;
        }

        /* --- 导航栏 --- */
        .nav-links {
            display: flex;
            gap: 0;
            font-size: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            position: relative;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 0;
            transition: background 0.15s ease, color 0.15s ease;
            font-weight: 400;
            border: 1px solid transparent;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            background: #1a1a1a;
        }

        .nav-links a.active {
            color: var(--text-primary);
            background: #1a1a1a;
            border: 1px solid var(--border-color);
        }

        /* --- 主体布局 --- */
        .main-container {
            display: flex;
            flex: 1;
            padding: 40px;
            gap: 40px;
            position: relative;
            z-index: 5;
        }

        /* --- 左侧边栏 --- */
        aside#sidebar {
            width: 180px;
            flex-shrink: 0;
            padding-right: 24px;
            position: relative;
        }

        aside#sidebar::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--border-color);
        }

        aside#sidebar h3 {
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 分类列表 */
        .category-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-list li {
            margin-bottom: 2px;
        }

        .category-list a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 15px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 0;
            transition: background 0.15s ease, color 0.15s ease;
            position: relative;
            border-left: 3px solid transparent;
        }

        .category-list a:hover {
            color: var(--text-primary);
            background: #1a1a1a;
            border-left: 3px solid var(--accent);
        }

        .category-list a.active {
            color: var(--text-primary);
            background: #1a1a1a;
            border-left: 3px solid var(--accent);
        }

        /* --- 右侧内容区 --- */
        .content-area {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .view-section {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 24px;
            width: 100%;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0;
            animation: cardReveal 0.4s ease forwards;
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- 资源卡片样式 --- */
        .resource-card {
            width: 260px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0;
            transition: border-color 0.15s ease, background 0.15s ease;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            position: relative;
        }

        .resource-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .resource-image {
            width: 100%;
            height: 140px;
            background: #1a1a1a;
            border-radius: 0;
            overflow: hidden;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        .resource-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .resource-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .resource-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .resource-tag {
            font-size: 10px;
            padding: 2px 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            border-radius: 0;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 400;
        }

        .resource-content h4 {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
        }

        .resource-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .resource-footer {
            display: flex;
            justify-content: flex-end;
        }

        .download-btn {
            background-color: transparent;
            color: var(--accent-light);
            border: 1px solid var(--accent);
            padding: 6px 16px;
            border-radius: 0;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .download-btn:hover {
            background: var(--accent);
            color: #ffffff;
        }

        /* --- 贡献者卡片 --- */
        .contributor-card {
            width: 170px;
            padding: 24px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0;
            transition: border-color 0.15s ease, background 0.15s ease;
            cursor: pointer;
        }

        .contributor-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .contributor-ring {
            width: 120px;
            height: 120px;
            border-radius: 0;
            border: 3px solid #ffffff;
            margin-bottom: 16px;
            background-color: #1a1a1a;
            overflow: hidden;
            transition: border-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contributor-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .contributor-card:hover .contributor-ring {
            border-color: var(--accent);
        }

        .contributor-card h4 {
            font-size: 17px;
            font-weight: 400;
            color: var(--text-primary);
            transition: color 0.15s ease;
        }

        .contributor-card:hover h4 {
            color: var(--accent-light);
        }

        /* --- 响应式 --- */
        @media (max-width: 768px) {
            header {
                padding: 16px 20px;
            }

            .logo-main-text {
                font-size: 32px;
            }

            .main-container {
                flex-direction: column;
                padding: 20px;
                gap: 24px;
            }

            aside#sidebar {
                width: 100%;
                padding-right: 0;
                padding-bottom: 20px;
            }

            aside#sidebar::after {
                width: 100%;
                height: 1px;
                top: auto;
                bottom: 0;
                background: var(--border-color);
            }

            .category-list {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }

            .category-list li {
                margin-bottom: 0;
            }

            .category-list a {
                padding: 6px 12px;
                border: 1px solid var(--border-color);
                border-left: 1px solid var(--border-color);
                font-size: 14px;
            }

            .category-list a:hover {
                border-left: 1px solid var(--accent);
                background: #1a1a1a;
            }

            .content-area {
                justify-content: center;
            }
        }
    </style>
</head>

    <script>
        function selectCategory(element) {
            document.querySelectorAll('.category-list a').forEach(a => a.classList.remove('active'));
            element.classList.add('active');
        }

        function switchTab(tabId, element) {
            document.getElementById('view-contributors').style.display = 'none';
            document.getElementById('view-resources').style.display = 'none';

            const activeView = document.getElementById('view-' + tabId);
            activeView.style.display = 'flex';
            activeView.style.flexWrap = 'wrap';
            activeView.style.gap = '32px';

            const links = document.querySelectorAll('.nav-links a');
            links.forEach(link => link.classList.remove('active'));
            element.classList.add('active');

            const sidebar = document.getElementById('sidebar');
            if (tabId === 'contributors') {
                sidebar.style.display = 'none';
            } else {
                sidebar.style.display = 'block';
            }

            const cards = activeView.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = `cardReveal 0.6s cubic-bezier(0.4, 0, 0.2, 1) ${index * 0.1}s forwards`;
            });
        }
    </script>
